name: Levenshtein
# Shared lint and security checks from wangjohn/levenshtein, run in its pinned
# Linux worker. PRs use native tools over staged declared inputs; other runs
# keep the pinned container. levenshtein.json selects the checks. Run the
# same thing locally from a sibling checkout of Levenshtein:
#
#   ../levenshtein/verify pre-merge --source .
#
# Both paths lint with Linux build tags, so the darwin-only files (the
# Keychain and launchd code) are covered by the macOS golangci-lint job in
# test.yml instead.
on:
  pull_request:
  push:
    branches: [main, 'release-candidate/**']
  schedule:
    # Daily fresh audit, so a newly published vulnerability surfaces without
    # waiting for the next change.
    - cron: '41 7 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # Cancel stale checks for one PR, while every main push and daily audit keeps
  # its own group. Include the workflow name so Test cannot cancel this run.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out agent-archive
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: app
          # Put the truthy depth first: a PR's zero must not fall back to one.
          fetch-depth: ${{ github.event_name != 'pull_request' && 1 || 0 }}
          persist-credentials: false
      # Pinned to a reviewed Levenshtein commit. Adopt new shared checks by
      # updating this SHA, never a moving branch.
      - name: Check out Levenshtein
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: wangjohn/levenshtein
          ref: 6f799f72befb925d10f2ef01a7c9a46725fa714d
          path: levenshtein
          persist-credentials: false
      - name: Set up pinned Go for Levenshtein
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: levenshtein/.go-version
          cache: false
      - name: Stage PR inputs and select checks
        if: github.event_name == 'pull_request'
        id: stage
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          NO_COLOR: '1'
          XDG_CACHE_HOME: ${{ runner.temp }}/native-xdg
          GOCACHE: ${{ runner.temp }}/native-go-build
          GOMODCACHE: ${{ runner.temp }}/native-go-mod
        run: |
          python3 -B ./app/scripts/stage_native_verify.py --source ./app \
            --destination "$RUNNER_TEMP/native-source" --shared ./levenshtein \
            --run pre-merge --pr-scope
      - name: Verify
        env:
          EVENT: ${{ github.event_name }}
          NO_COLOR: '1'
          PR_RUN: ${{ steps.stage.outputs.run }}
        run: |
          run=pre-merge
          if [[ "$EVENT" == schedule ]]; then
            run=main
          fi
          source=./app
          if [[ "$EVENT" == pull_request ]]; then
            # Native inputs fingerprint source but do not restrict discovery.
            # Stage the tracked configured inputs to match the container scope.
            # No candidate or PR Go build state is restored from another run.
            export GOCACHE="$RUNNER_TEMP/native-go-build"
            export GOMODCACHE="$RUNNER_TEMP/native-go-mod"
            export XDG_CACHE_HOME="$RUNNER_TEMP/native-xdg"
            source="$RUNNER_TEMP/native-source"
            run="$PR_RUN"
          fi
          ./levenshtein/verify "$run" --source "$source" --jobs 4 \
            --cache-dir "$RUNNER_TEMP/verification"
