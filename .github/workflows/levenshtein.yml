name: Levenshtein
# Shared lint and security checks from wangjohn/levenshtein, run in its pinned
# Linux container, except govulncheck uses the release Go compiler natively
# on this Linux runner. levenshtein.json selects the checks for each run. Run the
# same thing locally from a sibling checkout of Levenshtein:
#
#   ../levenshtein/verify pre-merge --source .
#
# The container lints with Linux build tags, so the darwin-only files (the
# Keychain and launchd code) are covered by the macOS golangci-lint job in
# test.yml instead.
on:
  pull_request:
  push:
    branches: [main, 'release-candidate/**']
  schedule:
    # Daily fresh audit, so a newly published vulnerability surfaces without
    # waiting for the next change.
    - cron: '41 7 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # Cancel stale checks for one PR, while every main push and daily audit keeps
  # its own group. Include the workflow name so Test cannot cancel this run.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out agent-archive
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: app
          persist-credentials: false
      # Pinned to a reviewed Levenshtein commit. Adopt new shared checks by
      # updating this SHA, never a moving branch.
      - name: Check out Levenshtein
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: wangjohn/levenshtein
          ref: 6f799f72befb925d10f2ef01a7c9a46725fa714d
          path: levenshtein
          persist-credentials: false
      # The native vulnerability scan must analyze the compiler used for releases.
      # Levenshtein obtains its own pinned launcher toolchain internally.
      - name: Set up the release Go compiler
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: app/go.mod
          cache: false
      - name: Require Go 1.27.2 for the native vulnerability scan
        env:
          GOTOOLCHAIN: local
        run: |
          go version
          go version | grep -q ' go1\.27\.2 ' || { echo "expected release compiler go1.27.2" >&2; exit 1; }
      - name: Verify
        env:
          EVENT: ${{ github.event_name }}
          NO_COLOR: '1'
        run: |
          run=pre-merge
          if [[ "$EVENT" == schedule ]]; then
            run=main
          fi
          ./levenshtein/verify "$run" --source ./app
