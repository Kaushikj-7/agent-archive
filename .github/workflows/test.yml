name: Test
on:
  pull_request:
  push:
    branches: ['release-candidate/**']
permissions:
  contents: read
concurrency:
  group: test-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
# Every action is pinned to a full commit SHA (a tag can be moved); the
# comment names the release it is. Dependabot proposes updates.
jobs:
  tier-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      native: ${{ steps.plan.outputs.native }}
      systemd: ${{ steps.plan.outputs.systemd }}
      linux: ${{ steps.plan.outputs.linux }}
      purge: ${{ steps.plan.outputs.purge }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Resolve exact-source tier and conservative extra coverage
        id: plan
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -B scripts/run_ci_tier.py --plan --output "$RUNNER_TEMP/extra-plan.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-tier-plan
          path: ${{ runner.temp }}/extra-plan.json
          if-no-files-found: error

  linux-short:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The Go version is pinned here rather than read from go.mod, so CI
      # never depends on how setup-go picks a toolchain. It must match
      # go.mod's toolchain line; the next step checks that.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
          cache: false
      - name: Require Go 1.27.2 (go.mod's toolchain line)
        run: |
          go version
          go version | grep -q ' go1\.27\.2 ' || { echo "expected go1.27.2, matching go.mod's toolchain line" >&2; exit 1; }
      - name: Discovered race-short shard
        env:
          SHARD: ${{ matrix.shard }}
        run: python3 scripts/run_go_shard.py --shard "$SHARD" --output shard-results
      - name: Preserve catalog and execution evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: go-shard-${{ matrix.shard }}
          path: shard-results
          if-no-files-found: error
          retention-days: 7

  linux-full:
    # PR extras are distinct from the exhaustive representative shards.
    needs: [tier-plan]
    # This job also exercises the real manager for sensitive PRs.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-tier-plan
          path: ${{ runner.temp }}/tier-plan
      - if: github.event_name != 'pull_request' || needs.tier-plan.outputs.linux == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
          cache: false
      - name: Start real manager for required platform extra coverage
        if: github.event_name == 'pull_request' && needs.tier-plan.outputs.systemd == 'true'
        run: bash scripts/start_ci_systemd.sh
      - name: Full candidate or conservative full PR extras
        env:
          AGENT_ARCHIVE_REAL_SYSTEMD: ${{ needs.tier-plan.outputs.systemd == 'true' && '1' || '0' }}
          EVENT: ${{ github.event_name }}
          FULL_LINUX: ${{ needs.tier-plan.outputs.linux }}
        run: |
          if [ "$EVENT" != pull_request ] || [ "$FULL_LINUX" = true ]; then go version | grep -q ' go1\.27\.2 '; fi
          if [ "$EVENT" = pull_request ]; then
            python3 scripts/run_ci_tier.py --tier full --suite extra --extra-plan "$RUNNER_TEMP/tier-plan/extra-plan.json" --output tier-results --seconds 3300
          else
            python3 scripts/run_ci_tier.py --tier full --suite linux --output tier-results
            go vet ./...
          fi
      - name: Preserve actual full and extra body evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: go-full-tier
          path: tier-results
          if-no-files-found: error


  script-tests:
    needs: [tier-plan]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 scripts/test_release_signing.py
      - run: python3 scripts/test_release_assets.py
      - run: python3 scripts/test_release_candidate.py
      - run: python3 scripts/test_install.py
      - run: python3 scripts/test_install_from_source.py
      - name: Install purge prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes jq zsh
      - name: Representative purge or required full purge extras
        env:
          EVENT: ${{ github.event_name }}
          FULL_PURGE: ${{ needs.tier-plan.outputs.purge }}
        run: |
          tier=pr
          if [ "$EVENT" != pull_request ] || [ "$FULL_PURGE" = true ]; then tier=full; fi
          python3 scripts/test_purge_recipe.py --tier "$tier" --evidence "$RUNNER_TEMP/purge-tier.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: purge-tier
          path: ${{ runner.temp }}/purge-tier.json
          if-no-files-found: error
      # Extended's real-systemd backstop keeps its name and validated image.
      - run: python3 scripts/test_ci_workflow.py
      - run: python3 scripts/test_stage_native_verify.py
      - run: python3 -B scripts/test_scope_native_verify.py
      - run: python3 -B scripts/test_stage_release_vulnerability_scan.py
      - run: python3 scripts/test_measure_hook.py
      # Static and fake-Docker checks of the Linux live acceptance scripts;
      # the live run itself needs privileged Docker and is not run in CI.
      - run: python3 scripts/test_linux_acceptance.py

      - run: python3 scripts/test_go_shards.py
      - run: python3 scripts/test_ci_tiers.py

  # Keep this required check stable and fail closed when a worker fails/skips.
  linux-race:
    if: always()
    needs: [linux-short, linux-full, script-tests, macos-smoke, tier-plan]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require complete event-specific worker results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/run_go_shard.py --verdict
      - name: Download both successful shard catalogs
        if: github.event_name == 'pull_request'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: go-shard-*
          path: shard-evidence
      - name: Reconcile actual source and exhaustive shard coverage
        if: github.event_name == 'pull_request'
        run: python3 scripts/run_go_shard.py --reconcile shard-evidence
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-tier-plan
          path: ${{ runner.temp }}/tier-plan
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: go-full-tier
          path: full-evidence
      - name: Require actual full or explicit empty extra coverage
        run: python3 scripts/run_ci_tier.py --verify --tier full --output full-evidence --extra-plan "$RUNNER_TEMP/tier-plan/extra-plan.json"

  git-identity-compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # Exact upstream releases exercise optional-command absence even
          # when the runner upgrades. This is not distribution-package proof.
          - git: upstream-2.30.2
            tag: v2.30.2
            ref: 94f6e3e283f2adfc518b39cfc39291f1c2832ad0
            expected: git version 2.30.2
          - git: upstream-2.39.2
            tag: v2.39.2
            ref: cbf04937d5b9fcf0a76c28f69e6294e9e3ecd7e6
            expected: git version 2.39.2
          - git: runner-current
            tag: ''
            ref: ''
            expected: ''
    name: Git identity (${{ matrix.git }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
          cache: false
      - name: Check out pinned upstream Git
        if: matrix.ref != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: git/git
          ref: ${{ matrix.ref }}
          path: git-fixture
          persist-credentials: false
      - name: Build pinned upstream Git (local-only commands)
        if: matrix.ref != ''
        working-directory: git-fixture
        env:
          PINNED_GIT_TAG: ${{ matrix.tag }}
          PINNED_GIT_COMMIT: ${{ matrix.ref }}
        run: |
          # Fetch only the release annotation for Git's version generator;
          # the code remains at the immutable commit checked out above.
          git fetch --depth=1 origin "refs/tags/$PINNED_GIT_TAG:refs/tags/$PINNED_GIT_TAG"
          test "$(git rev-parse HEAD)" = "$PINNED_GIT_COMMIT"
          make -j2 prefix="$RUNNER_TEMP/git-fixture" NO_TCLTK=YesPlease NO_GETTEXT=YesPlease NO_CURL=YesPlease NO_EXPAT=YesPlease all
          make prefix="$RUNNER_TEMP/git-fixture" NO_TCLTK=YesPlease NO_GETTEXT=YesPlease NO_CURL=YesPlease NO_EXPAT=YesPlease install
          echo "$RUNNER_TEMP/git-fixture/bin" >> "$GITHUB_PATH"
      - name: Isolated identity regressions and exact executable version
        env:
          EXPECTED_GIT_VERSION: ${{ matrix.expected }}
          HOME: ${{ runner.temp }}/git-identity-home
          XDG_CONFIG_HOME: ${{ runner.temp }}/git-identity-xdg
          GOCACHE: ${{ runner.temp }}/git-identity-go-cache
          GOMODCACHE: ${{ runner.temp }}/git-identity-go-modules
          GOMAXPROCS: '2'
        run: |
          mkdir -p "$HOME" "$XDG_CONFIG_HOME"
          git --version | tee "$RUNNER_TEMP/git-identity-version.txt"
          if [ -n "$EXPECTED_GIT_VERSION" ]; then
            test "$(git --version)" = "$EXPECTED_GIT_VERSION"
          fi
          cat "$RUNNER_TEMP/git-identity-version.txt" >> "$GITHUB_STEP_SUMMARY"
          go test -p 2 -count=1 -v ./internal/gitremote ./internal/sourcefacts
          go test -p 2 -count=1 -v -run 'RecoveredImport|DeletedWorktree' ./internal/backfill

  macos-smoke:
    needs: [tier-plan]
    # Compile every Darwin/cgo package, then exercise the native Keychain,
    # launchd, terminal, and setup paths before merging. The full race suite
    # runs on candidates and weekly in extended.yml.
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
          cache: false
      - name: Require Go 1.27.2 (go.mod's toolchain line)
        run: |
          go version
          go version | grep -q ' go1\.27\.2 ' || { echo "expected go1.27.2, matching go.mod's toolchain line" >&2; exit 1; }
      - name: Native representative smoke or required full platform extras
        env:
          FULL_NATIVE: ${{ needs.tier-plan.outputs.native }}
        run: |
          if [ "$FULL_NATIVE" = true ]; then
            python3 scripts/run_ci_tier.py --tier full --suite macos --output native-tier-results
          else
            ./scripts/test_macos_smoke.sh
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && needs.tier-plan.outputs.native == 'true'
        with:
          name: native-full-tier
          path: native-tier-results
          if-no-files-found: error

  cross-build:
    # The Linux test sees linux/amd64, and macos-smoke sees Darwin with cgo.
    # Build and vet the other release targets before a change reaches main.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
          cache: false
      - name: Require Go 1.27.2 (go.mod's toolchain line)
        run: |
          go version
          go version | grep -q ' go1\.27\.2 ' || { echo "expected go1.27.2, matching go.mod's toolchain line" >&2; exit 1; }
      - name: Build and vet linux/arm64
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: '0'
        run: |
          go build ./...
          go vet ./...
      # A macOS build without cgo uses the Keychain stand-in in
      # internal/credentials/keychain_nocgo_darwin.go, which macos-smoke
      # (cgo on) never compiles.
      - name: Vet darwin without cgo
        env:
          GOOS: darwin
          GOARCH: arm64
          CGO_ENABLED: '0'
        run: go vet ./...
      # The release workflow's Linux build and checks, on a placeholder
      # version, so everything except tagging and publishing is exercised
      # before a release.
      - name: Build and check the release's Linux binaries
        env:
          VERSION: v0.0.0-ci
        run: |
          ./scripts/build-release.sh linux
          ./scripts/verify-linux-release.sh

  lint:
    # macOS, the platform the tool ships for, so the cgo Keychain code is
    # linted too.
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # --new-from-merge-base below needs the base branch's history.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
          cache: false
      # Built with this job's Go (install-mode: goinstall) rather than
      # downloaded prebuilt, so it always understands go.mod's Go version.
      # Keep the version in step with the comment in .golangci.yml.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          install-mode: goinstall
          args: --disable=revive
      # Production code only tests reach belongs in a _test.go file (or a
      # test-only package); deadcode finds it. It analyses one build at a
      # time, so it runs twice: for macOS, and for Linux (GOOS=linux with cgo
      # off, the release configuration). The files with a !darwin build
      # constraint (internal/credentials/keychain_stub.go,
      # internal/backfill/birthtime_other.go,
      # internal/cursorstore/owner_other.go) are what ships on Linux, and the
      # macOS run never sees them; nor will it see future Linux-only files.
      # The Linux run reports one function the macOS run does not, because
      # only the macOS Keychain code calls it: credentials.errorForOSStatus
      # (EncodeSecret and DecodeSecret gained a Linux caller with the file
      # store). It has its own exception below; remove it when a Linux caller
      # appears. deadcode is built once
      # and run as a binary, since `go run` would try to execute a tool
      # cross-built for GOOS=linux.
      # Listed exceptions: the test helper packages, a cgo probe (test files
      # cannot use cgo), a load counter other packages' cost tests read, the
      # redacting String methods of cloudflare.S3Credentials (only fmt calls
      # them, and only if someone formats the key), and
      # the terminal UI layer in internal/cli/ui.go, whose parts the
      # onboarding screens adopt one PR at a time (they are listed by name:
      # remove each as it gains a caller, and the exception once none is left).
      - name: No unreachable production code
        run: |
          GOBIN="$RUNNER_TEMP/bin" go install golang.org/x/tools/cmd/deadcode@v0.50.0
          shared='^internal/(state/statetest|storage/storagetest|cloudflare/cloudflaretest|testutil)/|^internal/credentials/keychain_darwin\.go:[0-9]+:[0-9]+: unreachable func: lookupForbidsUI$|^internal/state/published\.go:[0-9]+:[0-9]+: unreachable func: PublishedStateLoads$|^internal/cli/ui\.go:[0-9]+:[0-9]+: unreachable func: (textStyle\.(spin|spinEvery)|spinner\.stop)$|^internal/cloudflare/r2\.go:[0-9]+:[0-9]+: unreachable func: S3Credentials\.(String|GoString)$'
          linux_only='|^internal/credentials/keychain_errors\.go:[0-9]+:[0-9]+: unreachable func: errorForOSStatus$'
          # check LABEL EXCEPTIONS: deadcode's output for the current
          # GOOS/CGO_ENABLED, minus the exceptions, must be empty.
          check() {
            "$RUNNER_TEMP/bin/deadcode" ./... > "$RUNNER_TEMP/deadcode-$1.txt"
            # grep exits 1 when every line is an exception; 2 is a real failure.
            status=0
            grep -v -E "$2" "$RUNNER_TEMP/deadcode-$1.txt" > "$RUNNER_TEMP/unexpected-$1.txt" || status=$?
            if [ "$status" -gt 1 ]; then
              exit "$status"
            fi
            if [ -s "$RUNNER_TEMP/unexpected-$1.txt" ]; then
              echo "Unreachable production code in the $1 build:" >&2
              cat "$RUNNER_TEMP/unexpected-$1.txt"
              echo "Move test-only code to a _test.go file, or delete it." >&2
              exit 1
            fi
          }
          check macos "$shared"
          GOOS=linux CGO_ENABLED=0 check linux "$shared$linux_only"
      # Doc comments are required on exported identifiers that a change adds
      # or touches; existing gaps do not fail the build.
      - name: Doc comments on new exported identifiers
        if: github.event_name == 'pull_request'
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          install-mode: goinstall
          args: --enable-only=revive --new-from-merge-base=origin/${{ github.base_ref }}
