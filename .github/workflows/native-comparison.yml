name: Native comparison
on:
  pull_request:
permissions:
  contents: read
jobs:
  compare:
    if: github.head_ref == 'codex/ci-speedup-05-native-20261012'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        executor: [native, dagger]
        sample: [baseline, probe]
    steps:
      - name: Check out comparison scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: harness
          persist-credentials: false
      - name: Check out identical deduplicated source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ed5aef9b8a1f67293c7e4541b8f3e3212936bfd2
          path: app
          persist-credentials: false
      - name: Check out pinned Levenshtein
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: wangjohn/levenshtein
          ref: 6f799f72befb925d10f2ef01a7c9a46725fa714d
          path: levenshtein
          persist-credentials: false
      - name: Set up identical Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: levenshtein/.go-version
          cache: false
      - name: Prepare failing diagnostic probe
        if: matrix.sample == 'probe'
        run: |
          cat > app/cmd/agent-archive/native_probe.go <<'EOF'
          package main
          import "fmt"
          func nativeDiagnosticProbe() { fmt.Printf("%d", "mismatch") }
          EOF
          git -C app add cmd/agent-archive/native_probe.go
          printf 'name: Diagnostic probe\non: pull_request\njobs:\n  probe:\n    runs-on: ubuntu-24.04\n    steps:\n      - run: echo "%s{{ github.event.pull_request.title }}"\n' '$' > app/.github/workflows/native-probe.yml
          git -C app add .github/workflows/native-probe.yml
      - name: Measure exact six checks
        env:
          EXECUTOR: ${{ matrix.executor }}
          SAMPLE: ${{ matrix.sample }}
          NO_COLOR: '1'
          GOCACHE: ${{ runner.temp }}/comparison-go-build
          GOMODCACHE: ${{ runner.temp }}/comparison-go-mod
          XDG_CACHE_HOME: ${{ runner.temp }}/comparison-xdg
          GOENV: 'off'
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: '1'
          GOFLAGS: ''
          GOMAXPROCS: '4'
        run: |
          umask 022
          mkdir evidence
          go version > evidence/toolchain.txt
          go env GOOS GOARCH CGO_ENABLED CC GOFLAGS >> evidence/toolchain.txt
          start=$(date +%s)
          source=app
          if [[ "$EXECUTOR" == native ]]; then
            python3 harness/scripts/stage_native_verify.py --source app --destination "$RUNNER_TEMP/native-source" --shared levenshtein
            source="$RUNNER_TEMP/native-source"
          fi
          set +e
          /usr/bin/time -v -o evidence/time.txt ./levenshtein/verify pre-merge --jobs 4 --source "$source" --cache-dir "$RUNNER_TEMP/verification" > evidence/report.json 2> evidence/stderr.txt
          status=$?
          set -e
          echo "$status" > evidence/exit-code.txt
          echo "$(($(date +%s) - start))" > evidence/total-wall-seconds.txt
          # Keep diagnostics and timing in normal job logs too; artifact storage
          # is not reachable from every managed development environment.
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path('evidence')
          print('COMPARISON_REPORT=' + json.dumps(json.loads((root / 'report.json').read_text()), separators=(',', ':')))
          print('COMPARISON_TOTAL_WALL=' + (root / 'total-wall-seconds.txt').read_text().strip())
          print((root / 'time.txt').read_text())
          PY
          if [[ "$SAMPLE" == baseline ]]; then test "$status" = 0; else test "$status" = 1; fi
      - name: Retain comparison evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-comparison-${{ matrix.executor }}-${{ matrix.sample }}-${{ github.run_attempt }}
          path: evidence
          retention-days: 30
