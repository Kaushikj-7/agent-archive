name: Representative cache measurement
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Root-journaled frozen measurement M SHA
        required: true
        type: string
      batch:
        description: Root-approved unused measurement namespace
        required: true
        type: string
      mode:
        description: Approved bounded observation
        required: true
        type: choice
        options: ['off', 'seed', 'warm']
permissions:
  contents: read
concurrency:
  group: representative-cache-measurement
  cancel-in-progress: false
# Proposal: off x2, seed x1, warm x2. No dispatch authority.
# Root must record M SHA externally after freeze; embedding M in its own tracked
# adapter/workflow would be self-referential. All dispatches supply that exact SHA.
env:
  EXPECTED_SHA: ${{ inputs.expected_sha }}
  BATCH: ${{ inputs.batch }}
  MODE: ${{ inputs.mode }}
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  worker0:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SHARD: '0'
      GOTOOLCHAIN: local
      GOWORK: 'off'
      GOFLAGS: '-mod=readonly'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set same controlled production paths
        run: |
          printf 'GOCACHE=%s/pr-go-build\nGOMODCACHE=%s/pr-go-modules\n' "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Validate and clear owned paths before any Go setup or tool
        run: python3 -B scripts/measure_go_cache.py paths
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
          cache: false
      - name: Require production toolchain
        run: |
          go version
          go version | grep -q ' go1\.27\.2 ' || { echo 'expected go1.27.2' >&2; exit 1; }
      - id: key
        run: python3 -B scripts/measure_go_cache.py prepare
      - id: restore
        if: inputs.mode != 'off'
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ steps.key.outputs.primary }}
          restore-keys: ${{ steps.key.outputs.restore_prefix }}
          path: |
            ${{ runner.temp }}/pr-go-build
            ${{ runner.temp }}/pr-go-modules
          enableCrossOsArchive: false
          fail-on-cache-miss: false
      - id: verify
        env:
          RESTORE_OUTCOME: ${{ steps.restore.outcome }}
          MATCHED_KEY: ${{ steps.restore.outputs.cache-matched-key }}
          EXACT_HIT: ${{ steps.restore.outputs.cache-hit }}
        run: python3 -B scripts/measure_go_cache.py verify
      - run: python3 -B scripts/measure_go_cache.py start-worker
      - id: worker
        run: python3 -B scripts/run_go_shard.py --shard "$SHARD" --output shard-results
      - id: complete
        run: python3 -B scripts/measure_go_cache.py complete
      - id: save
        if: success() && inputs.mode != 'off' && steps.complete.outputs.save_ready == 'true' && steps.verify.outputs.restore_state != 'exact'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ steps.key.outputs.primary }}
          path: |
            ${{ runner.temp }}/pr-go-build
            ${{ runner.temp }}/pr-go-modules
          enableCrossOsArchive: false
      - name: Warn on service failure
        if: always() && (steps.restore.outcome == 'failure' || steps.save.outcome == 'failure')
        run: echo '::warning::Cache service failed; retain actual failed observation allocation'
      - name: Retain uncached measurement evidence, including failures
        if: always()
        env:
          RESTORE_OUTCOME: ${{ steps.restore.outcome }}
          MATCHED_KEY: ${{ steps.restore.outputs.cache-matched-key }}
          EXACT_HIT: ${{ steps.restore.outputs.cache-hit }}
          SAVE_OUTCOME: ${{ steps.save.outcome }}
          WORKER_OUTCOME: ${{ steps.worker.outcome }}
        run: python3 -B scripts/measure_go_cache.py report
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: measure-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.mode }}-w0
          path: |
            shard-results
            ${{ runner.temp }}/measurement-evidence.json
          if-no-files-found: error
          retention-days: 7
  worker1:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SHARD: '1'
      GOTOOLCHAIN: local
      GOWORK: 'off'
      GOFLAGS: '-mod=readonly'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set same controlled production paths
        run: |
          printf 'GOCACHE=%s/pr-go-build\nGOMODCACHE=%s/pr-go-modules\n' "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Validate and clear owned paths before any Go setup or tool
        run: python3 -B scripts/measure_go_cache.py paths
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
          cache: false
      - name: Require production toolchain
        run: |
          go version
          go version | grep -q ' go1\.27\.2 ' || { echo 'expected go1.27.2' >&2; exit 1; }
      - id: key
        run: python3 -B scripts/measure_go_cache.py prepare
      - id: restore
        if: inputs.mode != 'off'
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ steps.key.outputs.primary }}
          restore-keys: ${{ steps.key.outputs.restore_prefix }}
          path: |
            ${{ runner.temp }}/pr-go-build
            ${{ runner.temp }}/pr-go-modules
          enableCrossOsArchive: false
          fail-on-cache-miss: false
      - id: verify
        env:
          RESTORE_OUTCOME: ${{ steps.restore.outcome }}
          MATCHED_KEY: ${{ steps.restore.outputs.cache-matched-key }}
          EXACT_HIT: ${{ steps.restore.outputs.cache-hit }}
        run: python3 -B scripts/measure_go_cache.py verify
      - run: python3 -B scripts/measure_go_cache.py start-worker
      - id: worker
        run: python3 -B scripts/run_go_shard.py --shard "$SHARD" --output shard-results
      - id: complete
        run: python3 -B scripts/measure_go_cache.py complete
      - id: save
        if: success() && inputs.mode != 'off' && steps.complete.outputs.save_ready == 'true' && steps.verify.outputs.restore_state != 'exact'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ steps.key.outputs.primary }}
          path: |
            ${{ runner.temp }}/pr-go-build
            ${{ runner.temp }}/pr-go-modules
          enableCrossOsArchive: false
      - name: Warn on service failure
        if: always() && (steps.restore.outcome == 'failure' || steps.save.outcome == 'failure')
        run: echo '::warning::Cache service failed; retain actual failed observation allocation'
      - name: Retain uncached measurement evidence, including failures
        if: always()
        env:
          RESTORE_OUTCOME: ${{ steps.restore.outcome }}
          MATCHED_KEY: ${{ steps.restore.outputs.cache-matched-key }}
          EXACT_HIT: ${{ steps.restore.outputs.cache-hit }}
          SAVE_OUTCOME: ${{ steps.save.outcome }}
          WORKER_OUTCOME: ${{ steps.worker.outcome }}
        run: python3 -B scripts/measure_go_cache.py report
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: measure-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.mode }}-w1
          path: |
            shard-results
            ${{ runner.temp }}/measurement-evidence.json
          if-no-files-found: error
          retention-days: 7
  benchmark-verdict:
    if: always()
    needs: [worker0, worker1]
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: measure-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.mode }}-w*
          path: ${{ runner.temp }}/shard-evidence
      - name: Actual worker statuses and authoritative current body reconciliation
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVIDENCE_DIRECTORY: ${{ runner.temp }}/shard-evidence
        run: python3 -B scripts/measure_go_cache.py verdict
