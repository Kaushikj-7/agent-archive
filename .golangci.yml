# golangci-lint v2 configuration. CI pins the golangci-lint version in
# .github/workflows/test.yml; run the same version locally:
#
#   go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
#   golangci-lint run --disable=revive    # what CI blocks on
#   golangci-lint run --enable-only=revive --new-from-merge-base=origin/main   # doc comments, new code only
#   golangci-lint run --enable-only=revive # all doc-comment debt (see below)
#
# Doc comments on exported identifiers (revive's `exported` rule) are required
# of new and changed code only: CI runs revive with --new-from-merge-base, and
# the blocking run disables it. Existing gaps are tracked as their own work.
version: "2"

linters:
  default: none
  enable:
    - bodyclose
    - depguard
    - errcheck
    - errorlint
    - funlen
    - gocyclo
    - gosec
    - govet
    - ineffassign
    - misspell
    - revive
    - staticcheck
    - unused
  settings:
    depguard:
      rules:
        integration-composition-only-at-cli:
          files:
            - "$all"
            - "!$test"
            - "!**/internal/cli/*.go"
            - "!**/internal/agents/builtin/*.go"
          deny:
            - pkg: github.com/wangjohn/agent-archive/internal/agents/builtin
              desc: CLI owns operational composition; core consumers receive narrow ports
            - pkg: github.com/wangjohn/agent-archive/internal/agents/claude
              desc: only builtin composes concrete integrations
            - pkg: github.com/wangjohn/agent-archive/internal/agents/codex
              desc: only builtin composes concrete integrations
            - pkg: github.com/wangjohn/agent-archive/internal/agents/cursor
              desc: only builtin composes concrete integrations
        concrete-integrations-only-at-builtin:
          files:
            - "$all"
            - "!$test"
            - "!**/internal/agents/builtin/*.go"
          deny:
            - pkg: github.com/wangjohn/agent-archive/internal/agents/claude
              desc: builtin is the sole native composition root
            - pkg: github.com/wangjohn/agent-archive/internal/agents/codex
              desc: builtin is the sole native composition root
            - pkg: github.com/wangjohn/agent-archive/internal/agents/cursor
              desc: builtin is the sole native composition root
        integrations-never-import-orchestration:
          files:
            - "**/internal/agents/**/*.go"
            - "!$test"
          deny:
            - pkg: github.com/wangjohn/agent-archive/internal/cli
              desc: host composition adapts integrations
            - pkg: github.com/wangjohn/agent-archive/internal/capture
              desc: native integrations emit typed effects without shared capture
            - pkg: github.com/wangjohn/agent-archive/internal/collector
              desc: native integrations supply sources and facts without publication
            - pkg: github.com/wangjohn/agent-archive/internal/backfill
              desc: native discovery supplies candidates without shared admission
        ports-and-values-have-no-process-or-network:
          files:
            - "**/internal/agentapi/*.go"
            - "**/internal/archive/*.go"
            - "**/internal/destination/*.go"
            - "**/internal/sourceidentity/*.go"
            - "!$test"
          deny:
            - pkg: os/exec
              desc: ports and facts never execute programs
            - pkg: net$
              desc: ports and facts have no network capability
            - pkg: net/http
              desc: ports and facts have no network client
            - pkg: github.com/wangjohn/agent-archive/internal/credentials
              desc: pure values cannot reach credential clients
            - pkg: github.com/wangjohn/agent-archive/internal/storage
              desc: pure values cannot reach storage clients
        native-codec-composition-belongs-to-integrations:
          files:
            - "$all"
            - "!$test"
            - "!**/internal/agents/*/*.go"
          deny:
            - pkg: github.com/wangjohn/agent-archive/internal/agents/nativecodec
              desc: core consumers receive narrow ports and cannot interpret native records
        archive-never-selects-native-integrations:
          files:
            - "**/internal/archive/*.go"
            - "!$test"
          deny:
            - pkg: github.com/wangjohn/agent-archive/internal/agentapi
              desc: pure archive facts cannot depend on operational ports
            - pkg: github.com/wangjohn/agent-archive/internal/agents/nativecodec
              desc: native integrations derive facts; archive builders consume them
        native-codecs-are-pure:
          files:
            - "**/internal/agents/nativecodec/*.go"
            - "!$test"
          deny:
            - pkg: os$
              desc: native codecs interpret borrowed input without filesystem or environment I/O
            - pkg: os/exec
              desc: native codecs never run programs
            - pkg: net$
              desc: native codecs never access the network
            - pkg: net/http
              desc: native codecs never access the network
            - pkg: github.com/wangjohn/agent-archive/internal/cli
              desc: native parsing cannot depend on CLI orchestration
            - pkg: github.com/wangjohn/agent-archive/internal/capture
              desc: native parsing cannot capture live state
            - pkg: github.com/wangjohn/agent-archive/internal/collector
              desc: native parsing cannot depend on publication orchestration
            - pkg: github.com/wangjohn/agent-archive/internal/backfill
              desc: native parsing cannot discover or import files
            - pkg: github.com/wangjohn/agent-archive/internal/state
              desc: native codecs cannot persist state
            - pkg: github.com/wangjohn/agent-archive/internal/storage
              desc: native codecs cannot read archive storage
            - pkg: github.com/wangjohn/agent-archive/internal/credentials
              desc: native codecs cannot open credentials
        identity-is-standard-library-only:
          files:
            - "**/internal/agentmeta/*.go"
            - "**/internal/jsonwire/*.go"
            - "!$test"
          list-mode: strict
          allow:
            - $gostd
        native-reads-are-isolated:
          files:
            - "**/internal/nativesessions/*.go"
            - "**/internal/transcriptio/*.go"
            - "!$test"
          deny:
            - pkg: os/exec
              desc: native reads never run programs
            - pkg: net/http
              desc: native reads never use the network
            - pkg: github.com/wangjohn/agent-archive/internal/config
              desc: native reads have no configured archive dependencies
            - pkg: github.com/wangjohn/agent-archive/internal/state
              desc: native reads never register or persist sessions
            - pkg: github.com/wangjohn/agent-archive/internal/storage
              desc: native reads never access archive storage
            - pkg: github.com/wangjohn/agent-archive/internal/credentials
              desc: native reads never access credentials
            - pkg: github.com/wangjohn/agent-archive/internal/collector
              desc: discovery does not filter full conversations
            - pkg: github.com/wangjohn/agent-archive/internal/cli
              desc: native reads have no CLI dependency
            - pkg: github.com/wangjohn/agent-archive/internal/terminal
              desc: native reads have no terminal dependency
        # statetest's whole-file saves bypass the single in-memory copy a
        # collector scan keeps (see its package doc), so only tests use it.
        statetest-only-in-tests:
          files:
            - "!$test"
          deny:
            - pkg: github.com/wangjohn/agent-archive/internal/state/statetest
              desc: test helpers only; production code saves through state.Published
        # The in-memory object store stands in for S3 and R2 in tests; nothing
        # in production may store to it (sessions would never leave the Mac).
        storagetest-only-in-tests:
          files:
            - "!$test"
          deny:
            - pkg: github.com/wangjohn/agent-archive/internal/storage/storagetest
              desc: test helpers only; production code stores through storage's S3 client
        # The fake Cloudflare API stands in for the real one in tests; nothing
        # in production may talk to it.
        cloudflaretest-only-in-tests:
          files:
            - "!$test"
          deny:
            - pkg: github.com/wangjohn/agent-archive/internal/cloudflare/cloudflaretest
              desc: test helpers only; production code uses the cloudflare client
        # The golden-file helper registers the -update test flag; a
        # production package importing it would grow that flag.
        golden-only-in-tests:
          files:
            - "!$test"
          deny:
            - pkg: github.com/wangjohn/agent-archive/internal/testutil
              desc: test helpers only
        # Retention deletes; the collector publishes. Retention's whole-session
        # delete lives in retention itself, so it never needs the collector.
        retention-does-not-import-collector:
          files:
            - "**/internal/retention/*.go"
            - "!$test"
          deny:
            - pkg: github.com/wangjohn/agent-archive/internal/collector
              desc: retention deletes through its own DeleteWholeSession
        # The hook runtime runs on the user's turn. internal/cli owns flags,
        # prompts, terminal output and the exit code; capture does none of
        # them, and nothing a hook must never do: run a program itself (launchctl;
        # the git lookup for a repository key is passed in by cli),
        # open the Keychain or a bucket, or use the network.
        # TestCaptureImportBoundary checks the same on every platform.
        capture-is-not-the-command-line:
          files:
            - "**/internal/capture/*.go"
            - "!$test"
          deny:
            - pkg: github.com/wangjohn/agent-archive/internal/cli
              desc: cli adapts capture, never the other way round
            - pkg: github.com/wangjohn/agent-archive/internal/terminal
              desc: a hook never writes to a terminal; return an error to cli
            - pkg: golang.org/x/term
              desc: a hook never prompts
            - pkg: os/exec
              desc: capture spawns nothing itself; the one program a hook runs (git, for the repository key) is a lookup cli passes in
            - pkg: os/signal
              desc: cli owns process signals
            - pkg: net$
              desc: a hook never touches the network
            - pkg: net/http
              desc: a hook never touches the network
            - pkg: github.com/wangjohn/agent-archive/internal/credentials
              desc: a hook never opens credentials
            - pkg: github.com/wangjohn/agent-archive/internal/storage
              desc: a hook never touches the bucket; the collector publishes
            - pkg: github.com/wangjohn/agent-archive/internal/collector
              desc: a hook only records; the collector publishes
            - pkg: github.com/wangjohn/agent-archive/internal/hooks
              desc: a hook does not install hooks
        # setup's transaction record is read by every command and by the hook,
        # so it stays free of the command-line layer.
        # TestSetupJournalImportBoundary checks the same on every platform.
        setupjournal-is-not-the-command-line:
          files:
            - "**/internal/setupjournal/*.go"
            - "!$test"
          deny:
            - pkg: github.com/wangjohn/agent-archive/internal/cli
              desc: cli drives the journal, never the other way round
            - pkg: github.com/wangjohn/agent-archive/internal/capture
              desc: the hook reads the journal; the journal knows nothing of hooks
            - pkg: github.com/wangjohn/agent-archive/internal/terminal
              desc: return errors; cli renders them
            - pkg: golang.org/x/term
              desc: prompts belong to cli
            - pkg: os/exec
              desc: a scheduler is driven only through the Backends the caller passes
            - pkg: os/signal
              desc: cli owns process signals
            - pkg: github.com/wangjohn/agent-archive/internal/credentials
              desc: the journal never opens credentials
        # The one place that knows the operating system is pure: it runs no
        # program and opens no file (what it needs from the system is passed
        # in as LocationDeps), and it opens no credentials or hook files.
        # TestPlatformImportBoundary checks the same on every platform, and
        # TestOnlyPlatformReadsRuntimeGOOS that nothing else reads
        # runtime.GOOS.
        platform-is-pure:
          files:
            - "**/internal/platform/*.go"
            - "!$test"
          deny:
            - pkg: os$
              desc: platform reads no files or environment; the caller passes them in
            - pkg: os/exec
              desc: platform runs no program; a LocationDeps function does
            - pkg: os/signal
              desc: cli owns process signals
            - pkg: net$
              desc: platform never touches the network
            - pkg: net/http
              desc: platform never touches the network
            - pkg: github.com/wangjohn/agent-archive/internal/credentials
              desc: credentials depends on platform, never the other way round
            - pkg: github.com/wangjohn/agent-archive/internal/hooks
              desc: platform knows nothing of hook files
        # The scheduler port (types, the interface, the Runner) is pure: it
        # runs no program, and an adapter runs its tool through the Runner it
        # is given. TestSchedulerImportBoundary checks the same on every
        # platform.
        scheduler-is-pure:
          files:
            - "**/internal/scheduler/*.go"
            - "!$test"
          deny:
            - pkg: os/exec
              desc: the port runs no program; an adapter's Runner does
            - pkg: os/signal
              desc: cli owns process signals
            - pkg: net$
              desc: the port never touches the network
            - pkg: net/http
              desc: the port never touches the network
            - pkg: github.com/wangjohn/agent-archive/internal/credentials
              desc: the port never opens credentials
            - pkg: github.com/wangjohn/agent-archive/internal/hooks
              desc: the port knows nothing of hook files
        # An adapter runs its tool only through the scheduler.Runner it is
        # given (host owns the real one), so a test's fake Runner is all it
        # can reach, and it imports neither another adapter's chooser nor the
        # command-line layer.
        scheduler-adapters-run-through-the-runner:
          files:
            - "**/internal/scheduler/launchd/*.go"
            - "**/internal/scheduler/systemd/*.go"
            - "!$test"
          deny:
            - pkg: os/exec
              desc: run the tool through the scheduler.Runner the adapter is given
            - pkg: os/signal
              desc: cli owns process signals
            - pkg: github.com/wangjohn/agent-archive/internal/credentials
              desc: an adapter never opens credentials
            - pkg: github.com/wangjohn/agent-archive/internal/hooks
              desc: an adapter knows nothing of hook files
            - pkg: github.com/wangjohn/agent-archive/internal/scheduler/host
              desc: host chooses adapters, never the other way round
            - pkg: github.com/wangjohn/agent-archive/internal/cli
              desc: cli drives the scheduler, never the other way round
        # host chooses the adapter for the system, and nothing else imports one:
        # cli, setupjournal and every other package name the port.
        # TestOnlyHostImportsAdapters checks the same on every platform.
        only-host-imports-scheduler-adapters:
          files:
            - "$all"
            - "!$test"
            - "!**/internal/scheduler/host/*.go"
          deny:
            - pkg: github.com/wangjohn/agent-archive/internal/scheduler/launchd
              desc: import the port (internal/scheduler); host chooses the adapter
            - pkg: github.com/wangjohn/agent-archive/internal/scheduler/systemd
              desc: import the port (internal/scheduler); host chooses the adapter
        # Running a program is limited to the listed packages
        # (TestOnlyListedPackagesRunPrograms is the same list, on every
        # platform); a new one is added there and here, with a reason.
        only-listed-packages-run-programs:
          files:
            - "$all"
            - "!$test"
            - "!**/internal/cli/*.go"
            - "!**/internal/cursorstore/*.go"
            - "!**/internal/gitremote/*.go"
            - "!**/internal/scheduler/host/*.go"
            - "!**/internal/termlaunch/*.go"
            - "!**/internal/testutil/**"
          deny:
            - pkg: os/exec
              desc: a package that runs a program is listed in TestOnlyListedPackagesRunPrograms; run a scheduler's tool through its Runner
        # The statistics engine takes metadata, options and a clock as
        # arguments and returns numbers: it reads no file, runs no program,
        # and uses no network, clock or randomness, and knows only the
        # archive's types. TestStatsImportBoundary and
        # TestStatsReadsNoClockOrEnvironment check the same on every platform.
        stats-is-pure:
          files:
            - "**/internal/stats/*.go"
            - "!$test"
          deny:
            - pkg: os$
              desc: stats reads no files or environment; the caller passes everything in
            - pkg: os/exec
              desc: stats runs no program
            - pkg: os/signal
              desc: cli owns process signals
            - pkg: net$
              desc: stats never touches the network
            - pkg: net/http
              desc: stats never touches the network
            - pkg: math/rand
              desc: stats is deterministic
            - pkg: github.com/wangjohn/agent-archive/internal/cli
              desc: cli renders stats, never the other way round
            - pkg: github.com/wangjohn/agent-archive/internal/terminal
              desc: return numbers; cli renders them
            - pkg: golang.org/x/term
              desc: prompts belong to cli
            - pkg: github.com/wangjohn/agent-archive/internal/storage
              desc: the caller reads metadata; stats never opens the bucket
            - pkg: github.com/wangjohn/agent-archive/internal/reader
              desc: the caller reads metadata; stats never opens the bucket
            - pkg: github.com/wangjohn/agent-archive/internal/credentials
              desc: stats never opens credentials
            - pkg: github.com/wangjohn/agent-archive/internal/state
              desc: stats never reads local state
        # How stats writes a number is pure too: it takes a value and returns
        # text, so the screen and the page print one number the same way.
        # TestFormattersImportBoundary checks the same on every platform.
        statsfmt-is-pure:
          files:
            - "**/internal/statsfmt/*.go"
            - "!$test"
          deny:
            - pkg: os$
              desc: statsfmt reads no files or environment
            - pkg: os/exec
              desc: statsfmt runs no program
            - pkg: net$
              desc: statsfmt never touches the network
            - pkg: net/http
              desc: statsfmt never touches the network
            - pkg: math/rand
              desc: statsfmt is deterministic
            - pkg: github.com/wangjohn/agent-archive/internal/cli
              desc: cli uses statsfmt, never the other way round
            - pkg: github.com/wangjohn/agent-archive/internal/terminal
              desc: return text; cli prints it
            - pkg: github.com/wangjohn/agent-archive/internal/stats
              desc: statsfmt formats numbers and knows nothing of the engine
            - pkg: github.com/wangjohn/agent-archive/internal/storage
              desc: statsfmt never opens the bucket
            - pkg: github.com/wangjohn/agent-archive/internal/reader
              desc: statsfmt never opens the bucket
            - pkg: github.com/wangjohn/agent-archive/internal/credentials
              desc: statsfmt never opens credentials
            - pkg: github.com/wangjohn/agent-archive/internal/state
              desc: statsfmt never reads local state
        # The stats page is a pure function of stats.Stats too: it writes no
        # file (cli does), reads no clock or environment, and never touches
        # the network, so the page it returns cannot fetch or leak anything.
        # TestRendererImportBoundary checks the same on every platform.
        statshtml-is-pure:
          files:
            - "**/internal/statshtml/*.go"
            - "!$test"
          deny:
            - pkg: os$
              desc: statshtml writes nothing; cli delivers the page it returns
            - pkg: os/exec
              desc: statshtml runs no program
            - pkg: net$
              desc: statshtml never touches the network
            - pkg: net/http
              desc: statshtml never touches the network
            - pkg: text/template
              desc: html/template escapes for the context; text/template does not
            - pkg: math/rand
              desc: statshtml is deterministic
            - pkg: github.com/wangjohn/agent-archive/internal/cli
              desc: cli delivers the page, never the other way round
            - pkg: github.com/wangjohn/agent-archive/internal/terminal
              desc: return the page; cli prints it
            - pkg: github.com/wangjohn/agent-archive/internal/storage
              desc: the caller reads metadata
            - pkg: github.com/wangjohn/agent-archive/internal/reader
              desc: the caller reads metadata
            - pkg: github.com/wangjohn/agent-archive/internal/credentials
              desc: statshtml never opens credentials
            - pkg: github.com/wangjohn/agent-archive/internal/state
              desc: statshtml never reads local state
    revive:
      rules:
        - name: exported
    # Size and complexity ceilings for new functions. The existing functions
    # above them are listed under exclusions until they are split up.
    funlen:
      lines: 150
      statements: 80
    gocyclo:
      min-complexity: 30
    staticcheck:
      # The defaults, minus the quickfix (QF) suggestions: they are
      # refactoring hints, not defects, and would only add noise here.
      checks: ["all", "-ST1000", "-ST1003", "-ST1016", "-ST1020", "-ST1021", "-ST1022", "-QF*"]
    gosec:
      excludes:
        # G104 (unhandled errors) duplicates errcheck, which is the one
        # authority on ignored errors here, with the std-error-handling preset.
        - G104
        # G204 (subprocess with variable arguments): every exec in this tool
        # passes an argv slice with no shell: launchctl with fixed verbs, and
        # `claude`/`codex --version` found on PATH under a 2-second timeout
        # (internal/cli/capabilities.go). That is the safe form G204 cannot
        # distinguish from the unsafe one.
        - G204
  exclusions:
    presets:
      # fmt.Fprint* to a terminal, Close on read-only files, and similar
      # calls whose errors are conventionally ignored.
      - std-error-handling
      - common-false-positives
    rules:
      # Tests build fixtures in t.TempDir() with literal paths and modes and
      # check results by assertion; gosec's file, permission, and path
      # checks describe production hazards that do not apply there. Long
      # scenario tests are long by design.
      - path: _test\.go
        linters: [gosec, funlen, gocyclo]
      # The same for the test helpers under internal/testutil, which depguard
      # keeps out of production code: golden files are repository files,
      # written with the tree's usual modes.
      - path: internal/testutil/
        linters: [gosec]

      # G304 (file inclusion via variable) is inherent to this tool: it reads
      # transcripts, configs, and state at paths the user's own apps and
      # hooks name, as the user. It is excluded only where it is by design,
      # not globally, so a new file-reading package gets looked at.
      # G703 (path traversal via taint) is the same finding from the taint
      # analyzer: the "tainted" paths are the user's own HOME, environment,
      # and config, and there is no privilege boundary to cross.
      - path: internal/(archive|backfill|cli|collector|cursorstore|evidence|hooks|local|reader)/
        text: G304|G703
        linters: [gosec]
      # G302 on a directory: 0700 is the private mode for a directory, which
      # needs its execute bit; G302 only knows file modes.
      - path: internal/(local/files|reader/cache)\.go
        text: G302
        linters: [gosec]
      # The handoff launcher is a script a terminal executes: 0700, private
      # to the user but executable.
      - path: internal/termlaunch/termlaunch\.go
        text: G302
        linters: [gosec]
      # A skip-reason enum value, not a credential.
      - path: internal/backfill/backfill\.go
        text: G101
        linters: [gosec]
      # md5 here is the S3 ETag of an object, used to compare content with
      # what the bucket reports, never as a security primitive.
      - path: internal/(storage/storagetest/memory|reader/cache)\.go
        text: G501
        linters: [gosec]
